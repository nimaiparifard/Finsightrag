# Full stack:  cp .env.example .env && docker compose -f infra/docker-compose.yml --env-file .env up -d --build
# Local LLM:   add --profile local-llm  (Ollama; then: docker compose exec ollama ollama pull qwen2.5:7b-instruct)
name: finsight

x-python-env: &python-env
  DATABASE_URL: postgres://${POSTGRES_USER:-finsight}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-finsight}
  REDIS_URL: redis://redis:6379/0
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  SERVING_URL: http://serving:8001
  SERVING_ADMIN_TOKEN: ${SERVING_ADMIN_TOKEN:-}
  FINSIGHT_DATA_DIR: /app/data
  SEC_USER_AGENT: ${SEC_USER_AGENT:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
  LANGFUSE_HOST: http://langfuse:3000
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsight} -d ${POSTGRES_DB:-finsight}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finsight}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 10s, timeout: 5s, retries: 10}

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    # Postgres for runs/metrics, a volume for artifacts (swap to s3://… + MinIO when you need remote artifacts)
    command: >
      sh -c "pip install -q psycopg2-binary &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-finsight}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finsight}
      --artifacts-destination /mlartifacts --serve-artifacts"
    volumes: [mlartifacts:/mlartifacts]
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["127.0.0.1:5000:5000"]

  backend:
    build: {context: .., dockerfile: backend/Dockerfile}
    environment: *python-env
    volumes: [appdata:/app/data]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    command: >
      sh -c "python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --worker-class gthread --timeout 180"
    ports: ["127.0.0.1:8000:8000"]

  worker:
    build: {context: .., dockerfile: backend/Dockerfile}
    environment: *python-env
    volumes: [appdata:/app/data]
    depends_on: {backend: {condition: service_healthy}}
    command: celery -A config worker -l info --concurrency 2
    healthcheck: {disable: true}

  beat:
    build: {context: .., dockerfile: backend/Dockerfile}
    environment: *python-env
    depends_on: {backend: {condition: service_healthy}}
    command: celery -A config beat -l info
    healthcheck: {disable: true}

  serving:
    build: {context: .., dockerfile: serving/Dockerfile}
    environment: *python-env
    volumes: [appdata:/app/data]
    ports: ["127.0.0.1:8001:8001"]
    depends_on: {redis: {condition: service_healthy}}
    # the index must exist first: `docker compose exec worker finsight ingest ...` (see README)

  frontend:
    build: {context: ../frontend, dockerfile: Dockerfile}
    depends_on: {backend: {condition: service_healthy}}
    ports: ["3000:8080"]

  prometheus:
    image: prom/prometheus:latest
    volumes: [./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports: ["127.0.0.1:3001:3000"]

  langfuse:
    image: langfuse/langfuse:2
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finsight}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      TELEMETRY_ENABLED: "false"
    ports: ["127.0.0.1:3002:3000"]

  ollama:
    profiles: [local-llm]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}

volumes: {pgdata: {}, miniodata: {}, mlartifacts: {}, appdata: {}, ollama: {}}
