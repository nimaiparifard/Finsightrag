# Dev overrides (auto-applied when you run compose from infra/): hot reload via bind mounts.
services:
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
  serving:
    volumes:
      - ../serving/app:/app/serving/app
      - ../ml/src:/app/ml/src
      - ../data:/app/data
    command: uvicorn app.main:get_app --factory --host 0.0.0.0 --port 8001 --reload
