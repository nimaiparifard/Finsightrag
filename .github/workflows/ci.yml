name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install ruff mypy
      - run: ruff check ml serving backend
      - run: ruff format --check ml serving backend
      - name: mypy (strict on the ml package)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ml llama-index-core langgraph types-requests types-PyYAML
          mypy --config-file ml/pyproject.toml ml/src

  test-ml:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_PASSWORD: test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e "ml[dev]" llama-index-core langgraph
      - run: pytest ml/tests --cov=finsight --cov-report=term-missing
        env:
          FINSIGHT_TEST_PG_DSN: postgresql://postgres:test@localhost:5432/postgres

  test-serving:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e "ml[dev]" -r serving/requirements.txt pytest httpx
      - run: pytest serving/tests

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ml -r backend/requirements-dev.txt
      - run: pytest --cov=apps --cov-fail-under=80
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build:
    runs-on: ubuntu-latest
    needs: [lint, test-ml, test-serving, test-backend, test-frontend]
    strategy:
      matrix:
        include:
          - {name: backend, file: backend/Dockerfile, context: .}
          - {name: serving, file: serving/Dockerfile, context: .}
          - {name: frontend, file: frontend/Dockerfile, context: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: finsight-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: finsight-${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt -r serving/requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  e2e:
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot the stack
        run: |
          cp .env.example .env
          sed -i 's/=change-me.*/=ci-secret-value-1234/' .env
          docker compose -f infra/docker-compose.yml --env-file .env up -d --build backend frontend postgres redis
      - name: Smoke test
        run: |
          for i in $(seq 1 40); do curl -fs localhost:8000/api/health/ && break; sleep 3; done
          curl -fs localhost:3000/healthz
          curl -fs localhost:3000/api/health/
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 200
